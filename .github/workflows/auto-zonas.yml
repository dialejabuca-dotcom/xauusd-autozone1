name: AUTO-ZONAS XAUUSD
on:
  schedule:
    # Cada hora en minuto :58 (UTC), Lun-Sab (incluye DOM para merge horario COL)
    - cron: '58 * * * 1,2,3,4,5,6'
  workflow_dispatch:  # permite disparo manual para tests

jobs:
  update-zones:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch price data from Twelve Data
        run: |
          # H1 — 60 velas para OB zones y sesgo H1
          curl -s "https://api.twelvedata.com/time_series?symbol=XAU%2FUSD&interval=1h&outputsize=60&apikey=21fe3d64e76247199a434bff93f9dffd" > /tmp/az_h1.json
          # D1 — 15 velas para sesgo semanal (swing diario), PDH/PDL, premium/discount
          curl -s "https://api.twelvedata.com/time_series?symbol=XAU%2FUSD&interval=1day&outputsize=15&apikey=21fe3d64e76247199a434bff93f9dffd" > /tmp/az_d1.json
          # 4H — 20 velas para Asian range (sesion asiatica = 00:00-08:00 UTC)
          curl -s "https://api.twelvedata.com/time_series?symbol=XAU%2FUSD&interval=4h&outputsize=20&apikey=21fe3d64e76247199a434bff93f9dffd" > /tmp/az_4h.json
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/az_h1.json'))
          if 'values' not in d:
              print('ERROR H1:', d.get('message', d.get('code', 'unknown')))
              sys.exit(1)
          d2 = json.load(open('/tmp/az_d1.json'))
          if 'values' not in d2:
              print('ERROR D1:', d2.get('message', d2.get('code', 'unknown')))
              sys.exit(1)
          print(f'OK: H1={len(d[\"values\"])} velas D1={len(d2[\"values\"])} velas, precio={d[\"values\"][0][\"close\"]}')
          "

      - name: Calculate macro context (sesgo semanal + PDH/PDL + Asian range)
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone

          # --- D1 data para sesgo semanal ---
          d1_vals = json.load(open('/tmp/az_d1.json'))['values']
          d1_highs  = [float(v['high'])  for v in d1_vals]
          d1_lows   = [float(v['low'])   for v in d1_vals]
          d1_opens  = [float(v['open'])  for v in d1_vals]
          d1_closes = [float(v['close']) for v in d1_vals]

          # Sesgo semanal: swing pivots en D1 (mínimo 10 velas)
          sh_d, sl_d = [], []
          for i in range(1, len(d1_vals)-1):
              if d1_highs[i] > d1_highs[i-1] and d1_highs[i] > d1_highs[i+1]:
                  sh_d.append(d1_highs[i])
              if d1_lows[i] < d1_lows[i-1] and d1_lows[i] < d1_lows[i+1]:
                  sl_d.append(d1_lows[i])

          sesgo_semanal = 'LATERAL'
          sesgo_semanal_fuerza = 'DEBIL'
          if len(sh_d) >= 2 and len(sl_d) >= 2:
              hh = sh_d[0] > sh_d[1]  # Higher High reciente
              hl = sl_d[0] > sl_d[1]  # Higher Low reciente
              lh = sh_d[0] < sh_d[1]  # Lower High reciente
              ll = sl_d[0] < sl_d[1]  # Lower Low reciente
              if hh and hl:
                  sesgo_semanal = 'ALCISTA'
                  sesgo_semanal_fuerza = 'FUERTE'
              elif lh and ll:
                  sesgo_semanal = 'BAJISTA'
                  sesgo_semanal_fuerza = 'FUERTE'
              elif hh or hl:
                  sesgo_semanal = 'ALCISTA'
                  sesgo_semanal_fuerza = 'DEBIL'
              elif lh or ll:
                  sesgo_semanal = 'BAJISTA'
                  sesgo_semanal_fuerza = 'DEBIL'

          # PDH / PDL (vela D1[1] = ayer completo, D1[0] = hoy en curso)
          pdh = d1_highs[1]  # Previous Day High
          pdl = d1_lows[1]   # Previous Day Low
          precio_actual = d1_closes[0]

          # Premium / Discount: rango de las últimas 5 velas D1
          rango_high = max(d1_highs[:5])
          rango_low  = min(d1_lows[:5])
          rango_mid  = (rango_high + rango_low) / 2
          if precio_actual > rango_mid:
              zona_precio = 'PREMIUM'
          else:
              zona_precio = 'DISCOUNT'

          print(f'sesgo_semanal={sesgo_semanal} ({sesgo_semanal_fuerza})')
          print(f'PDH={pdh:.2f} PDL={pdl:.2f}')
          print(f'rango_mid={rango_mid:.2f} zona_precio={zona_precio}')

          # --- 4H data para Asian range (00:00-08:00 UTC = 2 velas 4H) ---
          h4_vals = json.load(open('/tmp/az_4h.json'))['values']
          # Buscar las velas 4H de la sesion asiatica de hoy (00:00 y 04:00 UTC)
          asian_highs = []
          asian_lows  = []
          hoy_utc = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          for v in h4_vals:
              dt_str = v['datetime']
              if hoy_utc in dt_str:
                  hora = int(dt_str.split(' ')[1].split(':')[0]) if ' ' in dt_str else 0
                  if hora < 8:  # sesion asiatica = antes de 08:00 UTC
                      asian_highs.append(float(v['high']))
                      asian_lows.append(float(v['low']))

          if asian_highs:
              asian_high = max(asian_highs)
              asian_low  = min(asian_lows)
          else:
              # fallback: usar PDH/PDL si no hay velas asiaticas aun
              asian_high = pdh
              asian_low  = pdl

          print(f'asian_high={asian_high:.2f} asian_low={asian_low:.2f}')

          # Guardar macro_contexto en archivo temporal
          macro_ctx = {
              'sesgo_semanal': sesgo_semanal,
              'sesgo_semanal_fuerza': sesgo_semanal_fuerza,
              'zona_precio': zona_precio,
              'pdh': round(pdh, 2),
              'pdl': round(pdl, 2),
              'asian_high': round(asian_high, 2),
              'asian_low':  round(asian_low, 2),
              'rango_high': round(rango_high, 2),
              'rango_low':  round(rango_low, 2),
              'rango_mid':  round(rango_mid, 2),
              'updated': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          }
          with open('/tmp/az_macro.json', 'w') as f:
              json.dump(macro_ctx, f)
          print('macro_contexto calculado y guardado')
          "

      - name: Calculate OB zones and build zones.json
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone

          vals = json.load(open('/tmp/az_h1.json'))['values']
          highs  = [float(v['high'])  for v in vals]
          lows   = [float(v['low'])   for v in vals]
          opens  = [float(v['open'])  for v in vals]
          closes = [float(v['close']) for v in vals]
          precio = closes[0]

          # Sesgo H1
          sh, sl = [], []
          for i in range(1, len(vals)-1):
              if highs[i] > highs[i-1] and highs[i] > highs[i+1]: sh.append(highs[i])
              if lows[i]  < lows[i-1]  and lows[i]  < lows[i+1]:  sl.append(lows[i])
          sesgo = 'LATERAL'
          if len(sh) >= 2 and len(sl) >= 2:
              if sh[0] < sh[1] and sl[0] < sl[1]: sesgo = 'BAJISTA'
              elif sh[0] > sh[1] and sl[0] > sl[1]: sesgo = 'ALCISTA'
          print(f'precio={precio:.2f} sesgo={sesgo}')

          # OB SHORT (max 1 — la mas reciente por encima del precio)
          short_zones = []
          for i in range(len(vals)-2):
              if opens[i] > closes[i] * 1.004:
                  for j in range(i+1, min(i+10, len(vals))):
                      if closes[j] > opens[j]:
                          zh = max(opens[j], closes[j])
                          zl = min(opens[j], closes[j])
                          size = zh - zl
                          if size > 1.0 and precio < zh * 1.005:
                              short_zones.append({'type':'SHORT','zh':round(zh,2),'zl':round(zl,2),'sl':round(zh+size,2),'t1':round(zl-size*1.5,2)})
                              break
              if len(short_zones) >= 1: break

          # OB LONG (max 1 — la mas reciente por debajo del precio)
          long_zones = []
          for i in range(len(vals)-2):
              if closes[i] > opens[i] * 1.004:
                  for j in range(i+1, min(i+10, len(vals))):
                      if opens[j] > closes[j]:
                          zh = max(opens[j], closes[j])
                          zl = min(opens[j], closes[j])
                          size = zh - zl
                          if size > 1.0 and precio > zl * 0.995:
                              long_zones.append({'type':'LONG','zh':round(zh,2),'zl':round(zl,2),'sl':round(zl-size,2),'t1':round(zh+size*1.5,2)})
                              break
              if len(long_zones) >= 1: break

          zones_list = short_zones + long_zones
          print(f'zonas: {len(short_zones)} SHORT + {len(long_zones)} LONG')

          high_48h = max(highs[:48])
          low_48h  = min(lows[:48])

          # Cargar macro_contexto calculado en step anterior
          macro_ctx = json.load(open('/tmp/az_macro.json'))
          sesgo_semanal = macro_ctx['sesgo_semanal']
          print(f'sesgo_semanal={sesgo_semanal} zona_precio={macro_ctx[\"zona_precio\"]}')

          timestamp_str = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          zones_data = {
              'updated': timestamp_str,
              'sesgo': sesgo,
              'sesgo_semanal': sesgo_semanal,
              'macro_contexto': macro_ctx,
              'precio_actual': round(precio, 2),
              'high_48h': round(high_48h, 2),
              'low_48h':  round(low_48h, 2),
              'zones': zones_list
          }
          with open('zones.json', 'w') as f:
              json.dump(zones_data, f, separators=(',', ':'))
          print(f'zones.json escrito: {len(zones_list)} zonas | {timestamp_str}')
          "

      - name: Commit and push zones.json
        run: |
          git config user.email "auto-zonas@xauusd.system"
          git config user.name "AUTO-ZONAS"
          git add zones.json
          TIMESTAMP=$(python3 -c "import json; print(json.load(open('zones.json'))['updated'])")
          git commit -m "auto: zonas+macro $TIMESTAMP" || echo "noop — sin cambios"
          git push
