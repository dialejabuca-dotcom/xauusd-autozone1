name: Update Zones
on:
  repository_dispatch:
    types: [update-zones]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write and commit zones.json
        env:
          ZONES_JSON: ${{ toJSON(github.event.client_payload.zones) }}
          TIMESTAMP: ${{ github.event.client_payload.timestamp }}
        run: |
          echo "$ZONES_JSON" > zones.json
          git config user.email "bot@xauusd.bot"
          git config user.name "AUTO-ZONAS"
          git add zones.json
          git commit -m "auto: zones $TIMESTAMP" || echo "noop"
          git push
